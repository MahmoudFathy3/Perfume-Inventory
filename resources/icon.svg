<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#cffafe" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- الخلفية -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <!-- رذاذ العطر -->
  <g fill="#ffffff" fill-opacity="0.9">
    <circle cx="392" cy="112" r="7"/>
    <circle cx="414" cy="132" r="5.5"/>
    <circle cx="398" cy="150" r="4.5"/>
    <circle cx="428" cy="106" r="4"/>
    <circle cx="372" cy="92" r="3.5"/>
  </g>
  <!-- نجمة لمعان -->
  <path d="M116 112 l9 26 26 9 -26 9 -9 26 -9 -26 -26 -9 26 -9z" fill="#fde68a"/>

  <!-- الغطاء -->
  <rect x="206" y="88" width="100" height="76" rx="20" fill="url(#gold)"/>
  <rect x="304" y="108" width="46" height="20" rx="10" fill="url(#gold)"/>
  <rect x="216" y="98" width="30" height="56" rx="10" fill="#ffffff" fill-opacity="0.25"/>
  <!-- الرقبة -->
  <rect x="214" y="160" width="84" height="24" rx="9" fill="#fbbf24"/>
  <rect x="226" y="182" width="60" height="38" rx="8" fill="#e2e8f0"/>

  <!-- الزجاجة -->
  <rect x="148" y="212" width="216" height="232" rx="52" fill="url(#glass)"/>
  <!-- السائل -->
  <rect x="168" y="290" width="176" height="134" rx="36" fill="url(#liquid)"/>
  <!-- لمعة على الزجاج -->
  <rect x="172" y="236" width="20" height="150" rx="10" fill="#ffffff" fill-opacity="0.65"/>
  <!-- شعار على الزجاجة -->
  <path d="M256 322 l22 28 -22 28 -22 -28z" fill="#0f766e" fill-opacity="0.9"/>
  <path d="M256 336 l9 14 -9 14 -9 -14z" fill="#ffffff" fill-opacity="0.9"/>
</svg>
